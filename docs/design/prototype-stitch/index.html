<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype Stitch Index</title>
    <link rel="stylesheet" href="./assets/stitch-frame.css" />
  </head>
  <body data-app="index">
    <main class="index-shell">
      <header class="hero">
        <p class="eyebrow">Google Stitch Preserving Prototype</p>
        <h1>raw export をそのまま確認する viewer</h1>
        <p class="hero-copy">
          既存の <code>docs/design/prototype</code> はそのまま残し、こちらでは
          Google Stitch のデザインを崩さずに画面遷移だけを追加しています。
        </p>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Screen Routes</h2>
          <p>各画面は <code>screen.html?route=...</code> で直接開けます。</p>
        </div>
        <div id="screen-grid" class="screen-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Scenarios</h2>
          <p>代表的な導線の開始地点です。</p>
        </div>
        <div id="scenario-list" class="scenario-list"></div>
      </section>
    </main>

    <script type="module" src="./assets/stitch-wireup.js"></script>
  </body>
</html>
