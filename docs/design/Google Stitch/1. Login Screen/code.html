<!doctype html>

<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ログイン | 知識基盤 (Knowledge Infrastructure)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed": "#d6e3ff",
              "tertiary-fixed-dim": "#f2bc82",
              surface: "#f7f9fb",
              "primary-fixed-dim": "#adc7f7",
              "on-tertiary-container": "#c6955e",
              "on-secondary-fixed-variant": "#3e4758",
              "surface-container-low": "#f2f4f6",
              secondary: "#555f70",
              "on-surface-variant": "#43474e",
              "secondary-container": "#d9e3f8",
              "surface-container": "#eceef0",
              "on-tertiary-fixed": "#2b1700",
              outline: "#74777f",
              background: "#f7f9fb",
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e6e8ea",
              "inverse-surface": "#2d3133",
              error: "#ba1a1a",
              tertiary: "#321b00",
              "on-background": "#191c1e",
              "on-primary-fixed": "#001b3c",
              "on-primary-fixed-variant": "#2d476f",
              "primary-container": "#1a365d",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "surface-bright": "#f7f9fb",
              "inverse-primary": "#adc7f7",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#633f0f",
              "surface-dim": "#d8dadc",
              "surface-container-highest": "#e0e3e5",
              "tertiary-container": "#4f2e00",
              "tertiary-fixed": "#ffddba",
              "on-secondary": "#ffffff",
              "on-surface": "#191c1e",
              primary: "#002045",
              "inverse-on-surface": "#eff1f3",
              "secondary-fixed": "#d9e3f8",
              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#5b6577",
              "outline-variant": "#c4c6cf",
              "on-primary-container": "#86a0cd",
              "on-secondary-fixed": "#121c2b",
              "surface-variant": "#e0e3e5",
              "surface-tint": "#455f88",
              "secondary-fixed-dim": "#bdc7db",
              "on-primary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
          },
        },
      };
    </script>
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        vertical-align: middle;
      }
      body {
        font-family: "Inter", sans-serif;
        color: #191c1e;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden"
  >
    <!-- Background Architectural Elements -->
    <div class="absolute inset-0 z-0 pointer-events-none">
      <div
        class="absolute top-[-10%] left-[-5%] w-[40%] h-[60%] bg-primary-fixed/20 rounded-full blur-[120px]"
      ></div>
      <div
        class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[60%] bg-secondary-container/30 rounded-full blur-[120px]"
      ></div>
    </div>
    <main class="relative z-10 w-full max-w-[480px] px-6">
      <div class="flex flex-col items-center">
        <!-- Identity Header -->
        <div class="mb-12 text-center">
          <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container mb-6 shadow-xl shadow-primary-container/20"
          >
            <span
              class="material-symbols-outlined text-white text-4xl"
              data-icon="account_tree"
              >account_tree</span
            >
          </div>
          <h1
            class="text-[2.25rem] font-extrabold text-primary tracking-tight leading-tight mb-4"
          >
            知識基盤
          </h1>
          <p
            class="text-on-surface-variant font-body leading-relaxed text-sm max-w-[320px] mx-auto"
          >
            社内の疑問、回答、ナレッジを再利用可能な公式ナレッジへと変換するプラットフォームです。
          </p>
        </div>
        <!-- Login Card -->
        <div
          class="w-full glass-panel rounded-full p-10 shadow-2xl shadow-primary/5 ring-1 ring-white/50 bg-surface-container-lowest"
        >
          <div class="space-y-8">
            <!-- Action Section -->
            <div class="space-y-4">
              <button
                class="w-full flex items-center justify-center gap-3 py-4 px-6 bg-primary text-white rounded-md font-semibold text-base transition-all hover:bg-primary-container active:scale-[0.98] shadow-lg shadow-primary/10"
              >
                <!-- Custom Google-ish Svg for better visual trust -->
                <svg class="w-5 h-5" viewbox="0 0 24 24">
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="currentColor"
                  ></path>
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="currentColor"
                  ></path>
                  <path
                    d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                    fill="currentColor"
                  ></path>
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="currentColor"
                  ></path>
                </svg>
                <span>Google でログイン</span>
              </button>
            </div>
            <!-- Security/Policy Context -->
            <div class="pt-6 border-t border-surface-container-high">
              <div class="flex items-start gap-3">
                <span
                  class="material-symbols-outlined text-outline text-lg mt-0.5"
                  data-icon="verified_user"
                  >verified_user</span
                >
                <p
                  class="text-on-surface-variant text-[0.8125rem] leading-relaxed"
                >
                  ワークスペースへのアクセスは組織のアカウントに限定されます。ログインすることで利用規約に同意したものとみなされます。
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- Footer Meta -->
        <footer
          class="mt-12 flex flex-wrap justify-center gap-x-8 gap-y-2 text-[0.6875rem] font-semibold text-outline tracking-wider uppercase"
        >
          <a class="hover:text-primary transition-colors" href="#"
            >Privacy Policy</a
          >
          <a class="hover:text-primary transition-colors" href="#"
            >Terms of Service</a
          >
          <a class="hover:text-primary transition-colors" href="#">Support</a>
        </footer>
      </div>
    </main>
    <!-- Decorative Structural Graphic -->
    <div
      class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-px bg-gradient-to-r from-transparent via-surface-container-highest to-transparent"
    ></div>
    <div
      class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-px bg-gradient-to-r from-transparent via-surface-container-highest to-transparent"
    ></div>
  </body>
</html>
