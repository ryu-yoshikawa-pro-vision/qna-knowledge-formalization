<!doctype html>

<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>通知 - Knowledge Infrastructure</title>

    <link

      rel="stylesheet"

    />

      tailwind.config = {

          extend: {
            colors: {

              "tertiary-fixed-dim": "#f2bc82",
              surface: "#f7f9fb",
              "primary-fixed-dim": "#adc7f7",
              "on-tertiary-container": "#c6955e",
              "on-secondary-fixed-variant": "#3e4758",
              "surface-container-low": "#f2f4f6",

              "surface-container": "#eceef0",

              "inverse-surface": "#2d3133",
              error: "#ba1a1a",
              tertiary: "#321b00",
              "on-background": "#191c1e",
              "on-primary-fixed": "#001b3c",
              "on-primary-fixed-variant": "#2d476f",
              "primary-container": "#1a365d",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "surface-bright": "#f7f9fb",
              "inverse-primary": "#adc7f7",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#633f0f",
              "surface-dim": "#d8dadc",
              "surface-container-highest": "#e0e3e5",

              "tertiary-fixed": "#ffddba",
              "on-secondary": "#ffffff",
              "on-surface": "#191c1e",
              primary: "#002045",
              "inverse-on-surface": "#eff1f3",
              "secondary-fixed": "#d9e3f8",
              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#5b6577",
              "outline-variant": "#c4c6cf",
              "on-primary-container": "#86a0cd",
              "on-secondary-fixed": "#121c2b",
              "surface-variant": "#e0e3e5",
              "surface-tint": "#455f88",
              "secondary-fixed-dim": "#bdc7db",
              "on-primary": "#ffffff",

            borderRadius: {
              DEFAULT: "0.125rem",

              xl: "0.5rem",
              full: "0.75rem",

            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],

          },
        },
      };

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface">
    <!-- SideNavBar Shell -->
    <aside
      class="fixed left-0 top-0 h-full flex flex-col py-4 z-40 bg-blue-950 dark:bg-slate-950 w-64 shadow-xl shadow-blue-900/10"
    >
      <div class="px-6 mb-8">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 rounded bg-primary-fixed-dim flex items-center justify-center"
          >
            <span
              class="material-symbols-outlined text-primary"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >hub</span
            >
          </div>
          <div>
            <div class="text-lg font-bold text-white leading-none">
              知識基盤
            </div>
            <div
              class="text-[0.6875rem] font-semibold text-blue-200/50 uppercase tracking-wider"
            >
              Enterprise KM
            </div>
          </div>
        </div>
      </div>
      <nav class="flex-1 space-y-1 px-2">
        <a
          class="flex items-center gap-3 px-4 py-3 text-blue-200/70 hover:text-white hover:bg-blue-800/40 rounded-lg transition-all mx-2 group"
          href="#"
        >
          <span class="material-symbols-outlined">menu_book</span>
          <span class="text-[0.875rem] font-medium">知識</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-blue-200/70 hover:text-white hover:bg-blue-800/40 rounded-lg transition-all mx-2 group"
          href="#"
        >
          <span class="material-symbols-outlined">quiz</span>
          <span class="text-[0.875rem] font-medium">質問</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-blue-200/70 hover:text-white hover:bg-blue-800/40 rounded-lg transition-all mx-2 group"
          href="#"
        >
          <span class="material-symbols-outlined">bookmark</span>
          <span class="text-[0.875rem] font-medium">ブックマーク</span>
        </a>
        <!-- Active State: 通知 -->
        <a
          class="flex items-center gap-3 px-4 py-3 bg-blue-800 text-white rounded-lg mx-2 translate-x-1 transition-transform"
          href="#"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >notifications</span
          >
          <span class="text-[0.875rem] font-semibold">通知</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-blue-200/70 hover:text-white hover:bg-blue-800/40 rounded-lg transition-all mx-2 group"
          href="#"
        >
          <span class="material-symbols-outlined">settings_suggest</span>
          <span class="text-[0.875rem] font-medium">管理者設定</span>
        </a>
      </nav>
      <div class="px-6 mt-auto">
        <button
          class="w-full py-3 bg-primary-fixed-dim text-on-primary-fixed font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-white transition-colors"
        >
          <span class="material-symbols-outlined">add</span>
          <span>新規作成</span>
        </button>
      </div>
    </aside>
    <!-- Main Content Canvas -->
    <main class="ml-64 min-h-screen">
      <!-- TopNavBar Shell -->
      <header
        class="sticky top-0 z-30 bg-slate-50 dark:bg-slate-900 flex justify-between items-center px-8 h-16 w-full border-b-0"
      >
        <div class="flex items-center gap-8">
          <h2
            class="text-xl font-bold tracking-tight text-blue-900 dark:text-blue-100"
          >
            Knowledge Infrastructure
          </h2>
          <nav class="hidden md:flex gap-6">
            <a
              class="text-blue-900 dark:text-blue-100 font-semibold border-b-2 border-blue-900 py-1"
              href="#"
              >ワークスペース</a
            >
          </nav>
        </div>
        <div class="flex items-center gap-4">
          <button
            class="p-2 text-slate-500 hover:bg-slate-200/50 rounded-full transition-colors"
          >
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <button
            class="p-2 text-slate-500 hover:bg-slate-200/50 rounded-full transition-colors"
          >
            <span class="material-symbols-outlined">rate_review</span>
          </button>
          <div
            class="w-8 h-8 rounded-full overflow-hidden ml-2 ring-2 ring-surface-container-highest"
          >
            <img
              alt="User avatar"
              class="w-full h-full object-cover"
              data-alt="professional headshot of a corporate employee with a friendly smile, clean background"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPMV7wPZHrfOzYfGfLlbxV3-AJ2rfur17-4MjixbuzWLWP4huyYfKe8PpfMCr70sC645zLFj3rR0C-SDidfudodLJv-q2YZSqU3q7OyGBUl1I0LirfGh4JfNRjRI03wik5O8ywq71NBk4lgJCw5ds96LTyKCOhvaSz3Eb-X1ZqmTI12cygWSs6iC9__pp5pCmJU4SnoePhNtSNTyn0n1ebT9eo_XJedoRcbk5Is_M-zAIWlOP7_65PwSxeOlon1kUxd5Z2MCLHp-I"
            />
          </div>
        </div>
      </header>
      <!-- Content Area -->
      <div class="max-w-5xl mx-auto py-10 px-8">
        <!-- Header Section -->
        <div class="flex justify-between items-end mb-10">
          <div>
            <h1
              class="text-[2.0rem] font-bold text-primary leading-tight mb-2 tracking-tight"
            >
              通知
            </h1>
            <p class="text-on-surface-variant text-[0.875rem]">
              あなたに関するお知らせを確認します。
            </p>
          </div>
          <button
            class="flex items-center gap-2 text-primary font-semibold text-[0.875rem] px-4 py-2 hover:bg-primary-fixed/30 rounded-lg transition-colors"
          >
            <span class="material-symbols-outlined text-[1.2rem]"
              >done_all</span
            >
            すべて既読にする
          </button>
        </div>
        <!-- Filters Section (Bento Inspired Horizontal Layout) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
          <div
            class="col-span-1 bg-surface-container-lowest p-1.5 rounded-xl flex items-center shadow-sm"
          >
            <button
              class="flex-1 py-2 px-4 rounded-lg bg-primary text-white font-medium text-[0.75rem]"
            >
              すべて
            </button>
            <button
              class="flex-1 py-2 px-4 rounded-lg text-on-surface-variant hover:bg-surface-container-low font-medium text-[0.75rem]"
            >
              未読のみ
            </button>
          </div>
          <div class="col-span-3 flex items-center gap-2 overflow-x-auto pb-1">
            <span
              class="text-[0.6875rem] font-bold text-on-surface-variant/60 uppercase tracking-widest px-2"
              >種類</span
            >
            <button
              class="whitespace-nowrap px-4 py-2 bg-surface-container-lowest border border-outline-variant/20 rounded-full text-[0.75rem] font-medium hover:bg-white transition-all shadow-sm"
            >
              レビューリクエスト
            </button>
            <button
              class="whitespace-nowrap px-4 py-2 bg-surface-container-lowest border border-outline-variant/20 rounded-full text-[0.75rem] font-medium hover:bg-white transition-all shadow-sm"
            >
              コメント
            </button>
            <button
              class="whitespace-nowrap px-4 py-2 bg-surface-container-lowest border border-outline-variant/20 rounded-full text-[0.75rem] font-medium hover:bg-white transition-all shadow-sm"
            >
              解決済み
            </button>
          </div>
        </div>
        <!-- Notifications List -->
        <div class="space-y-4">
          <!-- Notification Item 1 (Unread) -->
          <div
            class="group relative bg-surface-container-lowest rounded-2xl p-5 shadow-[0_12px_40px_rgba(0,27,60,0.03)] hover:shadow-[0_12px_40px_rgba(0,27,60,0.06)] transition-all flex gap-5 border border-transparent hover:border-primary-fixed"
          >
            <!-- Unread Indicator -->
            <div
              class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-12 bg-primary rounded-r-full"
            ></div>
            <!-- Actor Avatar -->
            <div class="shrink-0">
              <div
                class="w-12 h-12 rounded-xl overflow-hidden ring-4 ring-primary-fixed/20"
              >
                <img
                  alt="佐藤 花子"
                  class="w-full h-full object-cover"
                  data-alt="portrait of a professional Japanese woman in business attire, smiling, high quality photography"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuDu-o6_0V-LF7SsCfku03_jxk62hkqCEtLgnmDPgf9-fyP-tSxaLMieGSmEH3iK_x9HjHIPG58SYLmqe0q9eUR89MfRrbIg8dt5dn5uFrBviWBguLildctLwO-qAGTU6ma8o0NlxCg59dM4CF5g-gSuUXJRAqW4I4WbFWAnGqIZOUD_eiX9Hr2gbDgqeRR3RCN0a0OE5uCjRV21zNeU5AG8yfRrOkAZA23pcJlxOQQFX33lUMgUue6Rn8lCC7nfMAFyVwrgtPtbwdE"
                />
              </div>
            </div>
            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start mb-1">
                <div class="flex items-center gap-2">
                  <span
                    class="text-[0.6875rem] font-bold px-2 py-0.5 bg-primary-fixed text-on-primary-fixed rounded"
                    >レビュー完了</span
                  >
                  <span class="text-[0.875rem] font-bold text-on-surface"
                    >佐藤 花子</span
                  >
                </div>
                <span
                  class="text-[0.6875rem] text-on-surface-variant/60 font-medium"
                  >1時間前</span
                >
              </div>
              <p class="text-[0.9375rem] text-on-surface mb-3 leading-relaxed">
                あなたのナレッジが承認されました
              </p>
              <!-- Target Link Card -->
              <a
                class="inline-flex items-center gap-3 bg-surface-container-low px-4 py-2.5 rounded-xl border border-outline-variant/10 hover:bg-surface-container transition-colors max-w-full"
                href="#"
              >
                <span
                  class="material-symbols-outlined text-primary text-[1.125rem]"
                  >description</span
                >
                <span class="text-[0.8125rem] font-medium text-primary truncate"
                  >新入社員向けオンボーディング手順</span
                >
                <span
                  class="material-symbols-outlined text-primary/40 text-[1rem]"
                  >arrow_forward</span
                >
              </a>
            </div>
          </div>
          <!-- Notification Item 2 (Read) -->
          <div
            class="group bg-surface-container-low/50 rounded-2xl p-5 flex gap-5 border border-transparent hover:border-outline-variant/30 transition-all opacity-80 hover:opacity-100"
          >
            <!-- Actor Avatar -->
            <div class="shrink-0">
              <div
                class="w-12 h-12 rounded-xl overflow-hidden grayscale contrast-75"
              >
                <img
                  alt="山田 太郎"
                  class="w-full h-full object-cover"
                  data-alt="portrait of a focused Japanese man in a modern office environment, blurred background"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNvmw3ajtEJPPxSNKY3UolAXQlvywcCUj2pqVWzterUXQCvbrdvVeFQQHTp2Nz-mFjoF89yX2E26UWjs1odnt5aptJ34Gxy2vJuWF1a7eTzcXzH4Ypu7Cb3mFCm5j_AY7tgHmZ7X0x6xpvCuvfIaQjI2QW3bcpVif1yyeiIApxkV55w3olo13RuqogeiepJcSjyRduD_UBW21uRncmaIp4paJvVEWLyHX8avRcBmeBKsX3QJogSJvMe9FsHFvKN-JYO4CeGJlGXgc"
                />
              </div>
            </div>
            <!-- Content -->
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start mb-1">
                <div class="flex items-center gap-2">
                  <span
                    class="text-[0.6875rem] font-bold px-2 py-0.5 bg-tertiary-fixed text-on-tertiary-fixed-variant rounded"
                    >コメント</span
                  >
                  <span class="text-[0.875rem] font-bold text-on-surface"
                    >山田 太郎</span
                  >
                </div>
                <span
                  class="text-[0.6875rem] text-on-surface-variant/60 font-medium"
                  >2時間前</span
                >
              </div>
              <p class="text-[0.9375rem] text-on-surface leading-relaxed">
                あなたの質問にコメントしました
              </p>
            </div>
          </div>
          <!-- Empty State Suggestion (Subtle Divider) -->
          <div
            class="py-10 flex flex-col items-center justify-center text-on-surface-variant/30"
          >
            <span
              class="material-symbols-outlined text-[3rem] mb-2"
              style="font-variation-settings: &quot;wght&quot; 200"
              >history</span
            >
            <p class="text-[0.75rem] font-medium tracking-widest">
              これ以前の通知はありません
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
