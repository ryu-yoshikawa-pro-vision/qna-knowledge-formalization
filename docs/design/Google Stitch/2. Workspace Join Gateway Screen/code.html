<!doctype html>

<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed": "#d6e3ff",
              "tertiary-fixed-dim": "#f2bc82",
              surface: "#f7f9fb",
              "primary-fixed-dim": "#adc7f7",
              "on-tertiary-container": "#c6955e",
              "on-secondary-fixed-variant": "#3e4758",
              "surface-container-low": "#f2f4f6",
              secondary: "#555f70",
              "on-surface-variant": "#43474e",
              "secondary-container": "#d9e3f8",
              "surface-container": "#eceef0",
              "on-tertiary-fixed": "#2b1700",
              outline: "#74777f",
              background: "#f7f9fb",
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e6e8ea",
              "inverse-surface": "#2d3133",
              error: "#ba1a1a",
              tertiary: "#321b00",
              "on-background": "#191c1e",
              "on-primary-fixed": "#001b3c",
              "on-primary-fixed-variant": "#2d476f",
              "primary-container": "#1a365d",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "surface-bright": "#f7f9fb",
              "inverse-primary": "#adc7f7",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#633f0f",
              "surface-dim": "#d8dadc",
              "surface-container-highest": "#e0e3e5",
              "tertiary-container": "#4f2e00",
              "tertiary-fixed": "#ffddba",
              "on-secondary": "#ffffff",
              "on-surface": "#191c1e",
              primary: "#002045",
              "inverse-on-surface": "#eff1f3",
              "secondary-fixed": "#d9e3f8",
              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#5b6577",
              "outline-variant": "#c4c6cf",
              "on-primary-container": "#86a0cd",
              "on-secondary-fixed": "#121c2b",
              "surface-variant": "#e0e3e5",
              "surface-tint": "#455f88",
              "secondary-fixed-dim": "#bdc7db",
              "on-primary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .tonal-glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen flex flex-col">
    <!-- Top Navigation Anchor -->
    <header
      class="bg-slate-50 dark:bg-slate-900 flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50"
    >
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center"
        >
          <span class="material-symbols-outlined text-white text-lg"
            >grid_guides</span
          >
        </div>
        <span
          class="text-xl font-bold tracking-tight text-blue-900 dark:text-blue-100"
          >Knowledge Infrastructure</span
        >
      </div>
      <div class="flex items-center gap-4">
        <button
          class="p-2 text-slate-500 hover:bg-slate-200/50 rounded-full transition-colors"
        >
          <span class="material-symbols-outlined">help</span>
        </button>
        <div
          class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden"
        >
          <img
            alt="User avatar"
            data-alt="minimalist flat illustration avatar of a professional user in cool tones"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvDCXSBc9x_TPR6r0LveDWfI8De53RWmkzRpNpt7cNs2IyipBMCYi5ReSU3VxSaHRdzxSBOIFOewhbcQV7Gs7EojxuiIqsUk7RzvXPJwTySC_Za6vjBXOfTtF4JKWGRittRseU3a8CJ-BXRPXBbIzx8kMAal29iKa1bb3J6L7hdBcC9oj5861nyL-Sn2gt2OhMEjkoRn7hotUem8Aw8-EZrr2nZJiyFNH0qQeWjezHf6I73e6rRHk_jgRuSxS0cHWZh9Efbm6K1Ls"
          />
        </div>
      </div>
    </header>
    <main class="flex-grow flex items-center justify-center pt-16 px-4">
      <!-- Main Content Area: Architectural & Calm -->
      <div class="max-w-xl w-full">
        <!-- Header Section -->
        <div class="text-center mb-10">
          <h1 class="text-3xl font-extrabold text-primary mb-4 leading-tight">
            ワークスペースに参加
          </h1>
          <p
            class="text-on-surface-variant body-md leading-relaxed max-w-md mx-auto"
          >
            あなたのドメインで利用可能なワークスペースが見つかりました。知的資本の共有を始めましょう。
          </p>
        </div>
        <!-- Bento Card: Invitation Available State -->
        <div
          class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_12px_40px_rgba(0,27,60,0.05)] border border-outline-variant/10 relative overflow-hidden group"
        >
          <!-- Background Accent -->
          <div
            class="absolute -right-12 -top-12 w-48 h-48 bg-primary-fixed/20 rounded-full blur-3xl group-hover:bg-primary-fixed/30 transition-all duration-700"
          ></div>
          <div class="relative z-10">
            <!-- Brand Identity -->
            <div class="flex items-center gap-4 mb-8">
              <div
                class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shadow-inner"
              >
                <span class="material-symbols-outlined text-white text-3xl"
                  >corporate_fare</span
                >
              </div>
              <div>
                <h2 class="text-xl font-bold text-primary">
                  株式会社ソリューション
                </h2>
                <p class="text-sm text-on-surface-variant font-medium">
                  enterprise-solution.jp
                </p>
              </div>
            </div>
            <!-- Details Section -->
            <div
              class="bg-surface-container-low rounded-lg p-6 mb-8 flex flex-col gap-4"
            >
              <div class="flex justify-between items-center">
                <span
                  class="text-sm font-semibold text-secondary flex items-center gap-2"
                >
                  <span class="material-symbols-outlined text-sm">person</span>
                  役割
                </span>
                <span
                  class="px-3 py-1 bg-primary-fixed text-on-primary-fixed rounded-full text-xs font-bold"
                >
                  メンバー
                </span>
              </div>
              <div class="h-px bg-outline-variant/20"></div>
              <div class="flex justify-between items-center">
                <span
                  class="text-sm font-semibold text-secondary flex items-center gap-2"
                >
                  <span class="material-symbols-outlined text-sm">mail</span>
                  ステータス
                </span>
                <span
                  class="px-3 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-full text-xs font-bold"
                >
                  招待済み
                </span>
              </div>
            </div>
            <!-- Primary Action -->
            <button
              class="w-full py-4 bg-primary text-white rounded-xl font-bold text-lg hover:shadow-lg hover:shadow-primary/20 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 group/btn"
            >
              <span>ワークスペースに参加する</span>
              <span
                class="material-symbols-outlined text-lg group-hover/btn:translate-x-1 transition-transform"
                >arrow_forward</span
              >
            </button>
          </div>
        </div>
        <!-- Secondary Guidance -->
        <div class="mt-12 text-center">
          <div class="inline-flex flex-col items-center gap-3">
            <p class="text-sm text-secondary">
              別のワークスペースをお探しですか？
            </p>
            <div class="flex gap-4">
              <button
                class="text-primary font-bold text-sm hover:underline underline-offset-4 flex items-center gap-1"
              >
                <span class="material-symbols-outlined text-sm">search</span>
                ドメイン外を検索
              </button>
              <div class="w-px h-4 bg-outline-variant/40"></div>
              <button
                class="text-primary font-bold text-sm hover:underline underline-offset-4 flex items-center gap-1"
              >
                <span class="material-symbols-outlined text-sm"
                  >add_circle</span
                >
                新規作成
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Visual Polish: Floating Decorative Elements -->
    <div class="fixed bottom-0 left-0 p-8 pointer-events-none opacity-40">
      <div class="w-32 h-32 border-l border-b border-primary/10"></div>
    </div>
    <footer
      class="h-16 flex items-center justify-center px-6 text-on-surface-variant/60 text-xs tracking-widest uppercase"
    >
      © 2024 Knowledge Infrastructure. All rights reserved.
    </footer>
    <!-- Style Enforcement for Material Icons Weights -->
    <style>
      [data-weight="fill"] {
        font-variation-settings: "FILL" 1 !important;
      }
    </style>
  </body>
</html>
